; bag_tag v1 - PlatformIO project
; PlatformIO has no first-party nice!nano board, so we borrow the generic
; nRF52840 board that uses the same Adafruit core + SoftDevice S140 layout
; as the nice!nano's Adafruit UF2 bootloader. Pins are addressed by raw nRF
; GPIO number in main.cpp, so the board's pin labels don't matter.

[env:nicenano]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit SH110X
    adafruit/Adafruit SSD1306
; Upload: double-tap the nice!nano's reset button first (NICENANO drive appears), then:
;   pio run -t upload
; If that fails, use the UF2 drag-and-drop route in README.md.
upload_protocol = nrfutil
